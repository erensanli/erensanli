<svg width="800" height="154" viewBox="0 0 800 154" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Metallic chrome gradient -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#94a3b8"/>
      <stop offset="70%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Bevel edge gradient -->
    <linearGradient id="bevelBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <filter id="metalShadow" x="-3%" y="-5%" width="106%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800;900&amp;display=swap');

    .mono {
      font-family: 'JetBrains Mono', 'Cascadia Code', 'Fira Code', 'SF Mono', Consolas, monospace;
      -webkit-font-smoothing: antialiased;
    }
    .title-metal {
      font-size: 17px;
      font-weight: 900;
      letter-spacing: 2px;
      fill: #ffffff;
    }
    .role-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.2px;
      fill: #e2e8f0;
    }
    .status-text {
      font-size: 10.5px;
      font-weight: 800;
      letter-spacing: 1.5px;
      fill: #ffffff;
    }
    .desc-text {
      font-size: 13px;
      line-height: 1.5;
      fill: #94a3b8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    .tag-text {
      font-size: 11px;
      font-weight: 600;
      fill: #cbd5e1;
    }
  </style>

  <!-- Card Body with Metallic Border -->
  <g filter="url(#metalShadow)">
    <rect x="2" y="2" width="796" height="148" rx="10" fill="#06080c" stroke="url(#bevelBorder)" stroke-width="1.2"/>

    <!-- Left Shield Icon (Chrome / Metallic Monochrome) -->
    <g transform="translate(24, 22)">
      <path d="M0 6L14 0L28 6V18C28 26 14 31 14 31C14 31 0 26 0 18V6Z" fill="#0f141d" stroke="#cbd5e1" stroke-width="1.5"/>
      <path d="M5 9L14 5L23 9V17C23 23 14 27 14 27C14 27 5 23 5 17V9Z" fill="#ffffff" fill-opacity="0.15"/>
    </g>

    <!-- Project Title -->
    <text x="64" y="43" class="mono title-metal">FOSHEPTIC AC</text>

    <!-- Sub-badge: DEVELOPER · KERNEL SYSTEMS -->
    <rect x="208" y="27" width="220" height="24" rx="4" fill="#0f141d" stroke="#334155" stroke-width="1"/>
    <text x="218" y="43" class="mono role-label">DEVELOPER · CORE SYSTEMS</text>

    <!-- Right Status: ACTIVE DEPLOYMENT -->
    <rect x="686" y="27" width="92" height="24" rx="4" fill="#0f141d" stroke="#334155" stroke-width="1"/>
    <circle cx="700" cy="39" r="3" fill="#ffffff"/>
    <text x="710" y="44" class="mono status-text">ONLINE</text>

    <!-- Description -->
    <text x="24" y="80" class="desc-text">Next-generation anti-cheat &amp; security enforcement architecture built for deterministic detection,</text>
    <text x="24" y="98" class="desc-text">low-overhead runtime telemetry, memory integrity validation, and resilient server-side telemetry.</text>

    <!-- Metallic Tag Pills -->
    <!-- Tag 1: C++ -->
    <rect x="24" y="114" width="46" height="22" rx="4" fill="#0f141d" stroke="#334155" stroke-width="1"/>
    <text x="32" y="129" class="mono tag-text">C++</text>

    <!-- Tag 2: Low-Level Architecture -->
    <rect x="76" y="114" width="168" height="22" rx="4" fill="#0f141d" stroke="#334155" stroke-width="1"/>
    <text x="84" y="129" class="mono tag-text">Security Architecture</text>

    <!-- Tag 3: Anti-Tamper -->
    <rect x="250" y="114" width="102" height="22" rx="4" fill="#0f141d" stroke="#334155" stroke-width="1"/>
    <text x="258" y="129" class="mono tag-text">Anti-Tamper</text>

    <!-- Tag 4: Telemetry -->
    <rect x="358" y="114" width="86" height="22" rx="4" fill="#0f141d" stroke="#334155" stroke-width="1"/>
    <text x="366" y="129" class="mono tag-text">Telemetry</text>

    <!-- Tag 5: Systems Engineering -->
    <rect x="450" y="114" width="164" height="22" rx="4" fill="#0f141d" stroke="#334155" stroke-width="1"/>
    <text x="458" y="129" class="mono tag-text">Systems Engineering</text>
  </g>
</svg>
