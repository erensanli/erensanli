<svg width="800" height="390" viewBox="0 0 800 390" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Drop shadow for terminal depth -->
    <filter id="terminalShadow" x="-3%" y="-3%" width="106%" height="108%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.95"/>
    </filter>

    <!-- Glowing red filter for error/hack codes -->
    <filter id="redGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&amp;display=swap');

    .mono {
      font-family: 'JetBrains Mono', 'Cascadia Code', 'Fira Code', 'SF Mono', Consolas, monospace;
      -webkit-font-smoothing: antialiased;
    }

    .title-bar-text {
      font-size: 12px;
      font-weight: 500;
      fill: #8b949e;
      letter-spacing: 0.5px;
    }

    .prompt-shell {
      font-size: 13px;
      font-weight: 700;
      fill: #e6edf3;
    }

    .prompt-cmd {
      font-size: 13px;
      font-weight: 500;
      fill: #f0f6fc;
    }

    .banner-title {
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 8px;
      fill: #ffffff;
    }

    .banner-sub {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      fill: #8b949e;
    }

    .init-text {
      font-size: 12px;
      font-weight: 500;
      fill: #a5d6ff;
    }

    .red-code {
      font-size: 11.8px;
      font-weight: 600;
      fill: #ff5555;
      letter-spacing: 0.2px;
    }

    .red-glow-line {
      font-size: 11.8px;
      font-weight: 700;
      fill: #ff3333;
      filter: url(#redGlow);
    }

    .red-dim {
      font-size: 11.8px;
      font-weight: 500;
      fill: #ea4a4a;
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .cursor-block {
      animation: blink 0.9s infinite;
      fill: #ff3333;
    }
  </style>

  <!-- Terminal Window Container -->
  <g filter="url(#terminalShadow)">
    <!-- Main Window Background -->
    <rect x="2" y="2" width="796" height="384" rx="10" fill="#06080c" stroke="#1f2633" stroke-width="1.2"/>

    <!-- Window Top Header Bar -->
    <path d="M2 12C2 6.47715 6.47715 2 12 2H788C793.523 2 798 6.47715 798 12V36H2V12Z" fill="#0e131b" stroke="#1f2633" stroke-width="1.2"/>

    <!-- Window Controls: Sleek Monochromatic Dots -->
    <circle cx="22" cy="19" r="4.5" fill="#2d333b"/>
    <circle cx="36" cy="19" r="4.5" fill="#2d333b"/>
    <circle cx="50" cy="19" r="4.5" fill="#2d333b"/>

    <!-- Center Title -->
    <text x="50%" y="23" text-anchor="middle" class="mono title-bar-text">kayzer@fosheptic: ~/kernel/anti-cheat - zsh</text>

    <!-- Top Right Status Pill -->
    <rect x="686" y="8" width="96" height="20" rx="4" fill="#06080c" stroke="#1f2633" stroke-width="1"/>
    <circle cx="698" cy="18" r="3" fill="#ff3333"/>
    <text x="708" y="22" class="mono" font-size="10.5" font-weight="700" fill="#ff5555" letter-spacing="1">INTERCEPT</text>

    <!-- Inner Terminal Content -->
    <!-- Line 1: Command execution -->
    <text x="24" y="62" class="mono">
      <tspan class="prompt-shell">kayzer@fosheptic:~$ </tspan>
      <tspan class="prompt-cmd">./fosheptic_ac --watch-kernel --sig-scan</tspan>
    </text>

    <!-- ASCII / Text Banner Header: F O S H E P T I C -->
    <text x="24" y="90" class="mono banner-title">[ F  O  S  H  E  P  T  I  C ]</text>
    <text x="24" y="108" class="mono banner-sub">:: ANTI-CHEAT CORE TELEMETRY DRIVER | DEV: KAYZER | RING-0 ::</text>

    <!-- Init info line -->
    <text x="24" y="130" class="mono init-text">[*] Polling thread contexts &amp; page table entries... ACTIVE</text>

    <!-- Red memory corruption / exploit / debug stream -->
    <text x="24" y="156" class="mono red-glow-line">[0x7FFF8A4C] ! ALERT: ANOMALOUS MEMORY_PAGE_ACCESS @ 0x00007FF7C021E400</text>
    
    <text x="24" y="178" class="mono red-code">[0x7FFF8A50] ! CRITICAL: VIRTUAL_PROTECT_BYPASS_ATTEMPT [PID: 4184 | TID: 0x1A4]</text>

    <text x="24" y="200" class="mono red-code">[0x7FFF8A58] ! KERNEL_INTEGRITY_FAIL: Hooked IAT table in ntdll.dll -> Detour: 0xDEADBEEF</text>

    <text x="24" y="222" class="mono red-dim">[0x7FFF8A64] ! CPU_REG_DUMP: RAX=0x00007FFF RCX=0xDEADBEEF RDX=0x00401000 RSP=0x7FFEEA90</text>

    <text x="24" y="244" class="mono red-dim">[0x7FFF8A70] ! DISASM: \x48\x89\x5C\x24\x08 \x57 \x48\x83\xEC\x20 \xFF\x25 [SHELLCODE INJECTION]</text>

    <text x="24" y="266" class="mono red-code">[0x7FFF8A78] ! THREAT_SIG_MATCH: Exploit.MemoryTamper.HookChain.v4 -> HEURISTIC 99.8%</text>

    <text x="24" y="288" class="mono red-glow-line">[0x7FFF8A84] ! ISOLATION: Terminating corrupted thread [0x1A4] -> STATUS_ACCESS_DENIED</text>

    <text x="24" y="310" class="mono red-code">[0x7FFF8A90] ! MEMORY_WIPE: Zeroing compromised stack segment [0x7FFEE000 - 0x7FFFF000]</text>

    <text x="24" y="332" class="mono red-dim">[0x7FFF8A9C] ! TELEMETRY_DISPATCH: Crashdump encrypted &amp; reported to Fosheptic Cloud</text>

    <!-- Final prompt waiting for input with red blinking cursor -->
    <text x="24" y="362" class="mono">
      <tspan class="prompt-shell">kayzer@fosheptic:~$ </tspan>
      <tspan class="cursor-block">█</tspan>
    </text>
  </g>
</svg>
